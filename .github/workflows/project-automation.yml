# Automação do Kanban: move a Issue vinculada ao PR (Closes #N) conforme o estado do PR.
# A lógica de GraphQL fica em scripts/project-status.sh (IDs resolvidos por nome).
#
# Implementado por etapas:
#   7a. PR rascunho aberto/reaberto/convertido → "Draft PR"
#   7b. PR pronto para revisão → "In Review"
#   7c. Reviews: aprovado → "Approved"; alterações pedidas → "In Progress";
#       aprovação descartada → volta a "In Review"
#   7d. PR fechado sem merge → "To Do" (ou a coluna de outro PR aberto da Issue);
#       PR mergeado → nada (o workflow nativo "Item closed" leva a Issue a Done)
#   8.  edited: "Closes #N" adicionado depois, editando a descrição do PR.
#       Casos sem evento (vínculo pela barra Development, PR com conflito) ficam
#       com a reconciliação agendada (project-reconcile.yml).
#
# Todos os eventos executam o mesmo cálculo (--auto): a coluna é decidida pelo
# estado consolidado de TODOS os PRs abertos da Issue na API (rascunho,
# reviewDecision, últimas reviews), e não pelo payload do evento.
# O resultado não depende da ordem dos eventos.

name: Project automation

on:
  pull_request:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

# Eventos do mesmo PR rodam em fila, na ordem em que chegaram.
concurrency:
  group: project-automation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-status:
    name: Sincronizar coluna da Issue
    # Review só com comentário não muda a coluna.
    if: github.event_name != 'pull_request_review' || github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (somente scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Gerar token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Mover Issues vinculadas
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER_TYPE: ${{ vars.OWNER_TYPE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PAYLOAD_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          echo "Evento: $EVENT_NAME.$EVENT_ACTION${REVIEW_STATE:+ (review: $REVIEW_STATE)} | payload merged=${PAYLOAD_MERGED:-<vazio>}"
          scripts/project-status.sh --pr "$PR_NUMBER" --auto
